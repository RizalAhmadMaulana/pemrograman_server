version: '3.7'
services:
  # --- NGINX (WEB SERVER) ---
  web:
    image: nginx:latest
    container_name: nginx_web
    ports:
      # Map Host Port 8084 ke Container Port 80
      - "8084:80"
    volumes:
      # Map kode aplikasi
      - ./src:/var/www/html
      # Map konfigurasi Nginx kustom
      - ./default.conf:/etc/nginx/conf.d/default.conf
    restart: always
    depends_on:
      - php-fpm
      
  # --- PHP-FPM (PHP PROCESSOR) ---
  php-fpm:
    # Build image dari Dockerfile di context saat ini
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_fpm
    volumes:
      # Map kode aplikasi, harus sama dengan di service 'web'
      - ./src:/var/www/html
    restart: always

  # --- MYSQL (DATABASE) ---
  mysql-db:
    image: mysql:5.7
    container_name: mysql_db
    # Map Host Port 3308 ke Container Port 3306 (Port default MySQL)
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root # Harap ganti dengan password kuat di produksi
      MYSQL_DATABASE: testdb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    command: --default-authentication-plugin=mysql_native_password
    restart: always

  # --- PHPMYADMIN (DATABASE UI) ---
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_ui
    ports:
      # Map Host Port 8082 ke Container Port 80
      - "8082:80"
    environment:
      # Mengizinkan login tanpa host yang ditentukan (default)
      PMA_ARBITRARY: 1
      # Host yang akan dihubungi oleh phpMyAdmin adalah nama service database (mysql-db)
      PMA_HOST: mysql-db 
    restart: always
    depends_on:
      - mysql-db
